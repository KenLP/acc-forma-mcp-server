# fly.toml — acc-forma-mcp-server remote HTTP transport (SPEC_remote-mcp.md R1)
#
# Public endpoint is https://mcp.bimlynx.com/mcp — the *.fly.dev hostname is an
# implementation detail and must not be handed out to tenants (see docs/HANDOFF.md).
#
# Secrets (never put these here — set them out-of-band):
#   fly secrets set \
#     FORMA_MASTER_KEY=<64 hex chars — LOSING THIS ORPHANS EVERY TENANT ROBOT KEY> \
#     APS_CLIENT_ID=<publisher APS app client id> \
#     APS_CLIENT_SECRET=<publisher APS app client secret>
#
# One-time setup:
#   fly apps create bimlynx-mcp
#   fly volumes create forma_data --region sin --size 1 --app bimlynx-mcp
#   fly deploy
#   fly certs add mcp.bimlynx.com            # then CNAME mcp -> bimlynx-mcp.fly.dev, DNS-only

app = "bimlynx-mcp"
primary_region = "sin" # Singapore — closest Fly region to APAC; change to taste

[build]

[env]
  # Non-secret defaults only. FORMA_TRANSPORT / FORMA_PERSISTENCE_MODE / FORMA_DB_PATH /
  # FORMA_AUDIT_DIR already default correctly via the Dockerfile's ENV — nothing required
  # here. Kept as an explicit (empty) table so secrets are visibly NOT the mechanism used.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "forma_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
