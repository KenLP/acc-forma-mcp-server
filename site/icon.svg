<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BIMLynx brand mark: lynx ears + watchful eyes, geometric/minimal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233d"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ears -->
  <polygon points="142,214 192,92 240,186" fill="#4c9aff"/>
  <polygon points="370,214 320,92 272,186" fill="#4c9aff"/>
  <!-- ear inner tufts -->
  <polygon points="168,196 193,124 216,180" fill="#0b1526"/>
  <polygon points="344,196 319,124 296,180" fill="#0b1526"/>
  <!-- eyes: slanted, alert -->
  <g fill="#e8eef7">
    <rect x="128" y="286" width="112" height="40" rx="20" transform="rotate(12 184 306)"/>
    <rect x="272" y="286" width="112" height="40" rx="20" transform="rotate(-12 328 306)"/>
  </g>
  <g fill="#0b1526">
    <circle cx="176" cy="308" r="13"/>
    <circle cx="336" cy="308" r="13"/>
  </g>
  <!-- nose -->
  <polygon points="256,368 232,344 256,328 280,344" fill="#4c9aff"/>
</svg>
